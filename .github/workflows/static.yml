# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate HTML sitemap
        run: |
          python3 -I - <<'PY'
          from html import escape
          from pathlib import Path
          from urllib.parse import quote

          paths = [Path("current.json"), *Path("version").rglob("*.json"), *Path("shards").glob("*.json")]
          links = "\n".join(
              f'<li><a href="{quote(path.as_posix())}">{escape(path.as_posix())}</a></li>'
              for path in sorted(paths)
          )
          Path("index.html").write_text(
              '<!doctype html>\n<html lang="en">\n<head>\n'
              '<meta charset="utf-8">\n'
              '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
              '<title>conta-index sitemap</title>\n</head>\n<body>\n'
              '<h1>conta-index sitemap</h1>\n<ul>\n'
              + links + '\n</ul>\n</body>\n</html>\n',
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
