<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>conta-index</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 70rem; margin: 2rem auto; padding: 0 1rem; }
    input, select, button { font: inherit; padding: .35rem; }
    input { width: 28rem; max-width: 100%; box-sizing: border-box; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: .75rem; }
    .controls label { display: block; margin-bottom: .25rem; }
    .controls > div { max-width: 100%; }
    #search-table { overflow-x: auto; margin-bottom: .75rem; }
    #search-table table { width: 100%; min-width: 48rem; table-layout: fixed; border-collapse: collapse; font-size: .9rem; }
    #search-table th, #search-table td { padding: .35rem .5rem; text-align: left; vertical-align: top; border-bottom: 1px solid #ddd; overflow-wrap: anywhere; }
    #search-table th { padding: 0; background: #f5f5f5; }
    #search-table .sort-column { display: block; width: 100%; padding: .35rem .5rem; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
    #search-table .sort-column:hover { background: #eee; }
    #search-table .sort-column:focus-visible { outline: 2px solid #06c; outline-offset: -2px; }
    #search-results .hash-copy { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
    #search-results .hash-copy:hover { background: #eee; }
    #search-results .hash-copy:focus-visible { outline: 2px solid #06c; outline-offset: 2px; }
    #search-results code { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #search-results a { display: inline-block; margin-right: .5rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
  <script src="search.js" defer></script>
</head>
<body>
  <h1>conta-index</h1>
  <section id="search" aria-labelledby="search-heading" hidden>
    <h2 id="search-heading">Search blobs</h2>
    <form id="search-form" role="search">
      <div class="controls">
        <div>
          <label for="search-query">Description or hash</label>
          <input id="search-query" type="search" aria-describedby="search-help" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="search-scope">Search in</label>
          <select id="search-scope">
            <option value="all">All</option>
            <option value="descriptions">Descriptions</option>
            <option value="hashes">Hashes</option>
          </select>
        </div>
        <button type="submit">Search</button>
      </div>
      <p id="search-help">Matches all space-separated terms, ignoring case. Hash fragments work too.</p>
    </form>
    <p id="search-status" role="status">Enter a description or hash to search.</p>
    <span id="copy-status" class="visually-hidden" role="status"></span>
    <button id="search-retry" type="button" hidden>Retry</button>
    <div id="search-table" role="region" aria-label="Search results" tabindex="0" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col"><button type="button" class="sort-column" data-sort="description">Description<span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" class="sort-column" data-sort="sha1">SHA-1<span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" class="sort-column" data-sort="sha256">SHA-256<span aria-hidden="true"></span></button></th>
            <th scope="col"><button type="button" class="sort-column" data-sort="downloads">Downloads<span aria-hidden="true"></span></button></th>
          </tr>
        </thead>
        <tbody id="search-results"></tbody>
      </table>
    </div>
    <button id="search-more" type="button" hidden>Show more</button>
  </section>
  <noscript><p>Search requires JavaScript. Browse the sitemap below.</p></noscript>
  <h2>Sitemap</h2>
  <ul>
    <!-- sitemap -->
  </ul>
</body>
</html>
